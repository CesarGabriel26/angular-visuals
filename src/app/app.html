    <main class="px-5 py-6 sm:px-8 lg:px-10">
      <section id="overview" class="mb-10">
        <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Catálogo de componentes</p>
            <h2 class="mt-2 text-3xl font-semibold tracking-normal text-slate-950">Angular Visuals</h2>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            @for (variant of variants; track variant) {
              <button
                type="button"
                class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium capitalize text-slate-700 transition-colors hover:border-slate-400"
                [class.border-slate-950]="activeVariant() === variant"
                [class.text-slate-950]="activeVariant() === variant"
                (click)="setVariant(variant)"
              >
                {{ variant }}
              </button>
            }
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <div class="rounded-lg border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">Componentes</p>
            <p class="mt-2 text-3xl font-semibold text-slate-950">17</p>
          </div>
          <div class="rounded-lg border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">Variantes</p>
            <p class="mt-2 text-3xl font-semibold capitalize text-slate-950">{{ activeVariant() }}</p>
          </div>
          <div class="rounded-lg border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">Registros</p>
            <p class="mt-2 text-3xl font-semibold text-slate-950">{{ mock.length }}</p>
          </div>
          <div class="rounded-lg border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">Estilos</p>
            <p class="mt-2 text-3xl font-semibold text-slate-950">Local</p>
          </div>
        </div>
      </section>

      <section id="buttons" class="mb-12 scroll-mt-6">
        <div class="mb-4 flex items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-semibold text-slate-950">Buttons & Toggles</h2>
            <p class="text-sm text-slate-500">Estados, formatos, loading e preenchimento por valor.</p>
          </div>
          <span av-badge [variant]="activeVariant()">interactive</span>
        </div>

        <div class="grid gap-4 xl:grid-cols-[1.2fr_.8fr]">
          <div class="rounded-lg border border-slate-200 bg-white p-5">
            <div class="mb-5 flex flex-wrap gap-3">
              @for (buttonVariant of buttonVariants; track buttonVariant) {
                <button av-button [variant]="buttonVariant" icon="check" iconProvider="av">
                  {{ buttonVariant }}
                </button>
              }
            </div>

            <div class="flex flex-wrap items-center gap-3">
              <button av-button [variant]="activeVariant()" [loading]="true">
                Processando
              </button>
              <button av-button [variant]="activeVariant()" hoverAnimation="fill">
                Hover fill
              </button>
              <button
                av-button
                [variant]="activeVariant()"
                [fillByValue]="true"
                [fillValue]="progressValue()"
                [fillTotal]="100"
              >
                {{ progressValue() }}%
              </button>
              <button av-button variant="gray-outlined" disabled>
                Desabilitado
              </button>
            </div>
          </div>

          <div class="rounded-lg border border-slate-200 bg-white p-5">
            <p class="mb-4 text-sm font-semibold text-slate-700">Button group</p>
            <div class="mb-6">
              <div av-button-group>
                <button av-button [variant]="activeVariant()">Dia</button>
                <button av-button [variant]="activeVariant()">Semana</button>
                <button av-button [variant]="activeVariant()">Mês</button>
              </div>
            </div>

            <p class="mb-4 text-sm font-semibold text-slate-700">Toggles</p>
            <div class="flex flex-wrap gap-3">
              @for (variant of variants; track variant) {
                <av-toggle icon="check" [variant]="variant"></av-toggle>
              }
            </div>
          </div>
        </div>
      </section>

      <section id="badges" class="mb-12 scroll-mt-6">
        <div class="mb-4">
          <h2 class="text-xl font-semibold text-slate-950">Badges</h2>
          <p class="text-sm text-slate-500">Cores sólidas para metadados, status e contadores.</p>
        </div>

        <div class="grid gap-4 lg:grid-cols-2">
          <div class="rounded-lg border border-slate-200 bg-white p-5">
            <div class="flex flex-wrap gap-2">
              @for (variant of variants; track variant) {
                <span av-badge [variant]="variant">{{ variant }}</span>
              }
            </div>
          </div>

          <div class="rounded-lg border border-slate-200 bg-white p-5">
            <div class="space-y-3">
              @for (variant of variants; track variant) {
                <div class="flex items-center justify-between border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                  <span class="text-sm font-medium text-slate-700 capitalize">{{ variant }} pipeline</span>
                  <span av-badge [variant]="variant">{{ variant === activeVariant() ? 'ativo' : 'pronto' }}</span>
                </div>
              }
            </div>
          </div>
        </div>
      </section>

      <section id="progress" class="mb-12 scroll-mt-6">
        <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
          <div>
            <h2 class="text-xl font-semibold text-slate-950">Progress & Indicators</h2>
            <p class="text-sm text-slate-500">Linear, striped, gradiente e circular usando a variante ativa.</p>
          </div>
          <label class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600">
            <span>Valor</span>
            <input
              type="range"
              min="0"
              max="100"
              [value]="progressValue()"
              (input)="setProgressFromEvent($event)"
              class="w-40 accent-slate-900"
            />
            <span class="w-8 text-right font-semibold text-slate-900">{{ progressValue() }}</span>
          </label>
        </div>

        <div class="grid gap-4 lg:grid-cols-[1fr_260px]">
          <div class="rounded-lg border border-slate-200 bg-white p-5">
            <div class="space-y-5">
              <av-progress-bar [value]="progressValue()" [max]="100" [variant]="activeVariant()"></av-progress-bar>
              <av-progress-bar [value]="progressSecondary()" [max]="100" variant="orange" [striped]="true"></av-progress-bar>
            </div>
          </div>

          <div class="rounded-lg border border-slate-200 bg-white p-5">
            <div class="mx-auto h-44 w-44">
              <av-progress-bar-circle [value]="progressValue()" [max]="100" [variant]="activeVariant()"></av-progress-bar-circle>
            </div>
          </div>
        </div>
      </section>

      <section id="stepper" class="mb-12 scroll-mt-6">
        <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
          <div>
            <h2 class="text-xl font-semibold text-slate-950">Stepper</h2>
            <p class="text-sm text-slate-500">Navegação por etapa com estado controlado pela demo.</p>
          </div>
          <div class="flex gap-2">
            <button av-button variant="gray-outlined" icon="arrow_left" iconProvider="av" (click)="previousStep()">Voltar</button>
            <button av-button [variant]="activeVariant()" icon="arrow_right" iconProvider="av" (click)="nextStep()">Avançar</button>
          </div>
        </div>

        <div class="rounded-lg border border-slate-200 bg-white p-5">
          <av-stepper [variant]="activeVariant()" [currentStep]="stepIndex()" [canSetStep]="true">
            <av-step title="Briefing" icon="1">
              <div class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-700">Mapeamento dos requisitos do componente.</p>
              </div>
            </av-step>
            <av-step title="Tokens" icon="2">
              <div class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-700">Aplicação da variante {{ activeVariant() }} em estados visuais.</p>
              </div>
            </av-step>
            <av-step title="Acessibilidade" icon="3">
              <div class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-700">Conferência de foco, disabled e feedback.</p>
              </div>
            </av-step>
            <av-step title="Entrega" icon="4">
              <div class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-700">Componente pronto para uso isolado.</p>
              </div>
            </av-step>
          </av-stepper>
        </div>
      </section>

      <section id="forms" class="mb-12 scroll-mt-6">
        <div class="mb-4">
          <h2 class="text-xl font-semibold text-slate-950">Forms & Inputs</h2>
          <p class="text-sm text-slate-500">Inputs, select, multi-select, moeda, checkbox e date/time.</p>
        </div>

        <form av-form (submit)="$event.preventDefault()">
          <div class="grid gap-4 md:grid-cols-2">
            <av-input
              label="Nome"
              placeholder="Ana Silva"
              icon="search"
              iconProvider="av"
              [ringColor]="activeVariant()"
            ></av-input>

            <av-currency-input
              label="Budget"
              [ringColor]="activeVariant()"
            ></av-currency-input>

            <av-select
              label="Projeto"
              placeholder="Escolha um tipo"
              icon="search"
              iconProvider="av"
              [data]="formOptions"
              [ringColor]="activeVariant()"
            ></av-select>

            <av-multi-select
              label="Times"
              placeholder="Selecione os times"
              icon="search"
              iconProvider="av"
              [data]="teamOptions"
              [ringColor]="activeVariant()"
            ></av-multi-select>

            <av-date-picker
              label="Entrega"
              mode="datetime"
              [ringColor]="activeVariant()"
            ></av-date-picker>

            <div class="flex items-end">
              <av-checkbox label="Aprovar fluxo visual" [ringColor]="activeVariant()"></av-checkbox>
            </div>
          </div>
        </form>
      </section>

      <section id="table" class="mb-12 scroll-mt-6">
        <div class="mb-4">
          <h2 class="text-xl font-semibold text-slate-950">Table & Paginator</h2>
          <p class="text-sm text-slate-500">Ordenação por coluna, paginação e badges por registro.</p>
        </div>

        <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
          <av-table
            [value]="pagedRows()"
            [paginator]="true"
            [totalRecords]="mock.length"
            [pageIndex]="tablePageIndex()"
            [pageSize]="tablePageSize()"
            [rowsPerPageOptions]="pageSizes"
            [sortField]="sortField()"
            [sortOrder]="sortOrder()"
            [variant]="activeVariant()"
            (onSort)="handleSort($event)"
            (onPage)="handlePage($event)"
          >
            <ng-template #header>
              <tr>
                <th avSortableColumn="firstName" class="cursor-pointer select-none px-4 py-3">
                  Nome <av-sort-icon field="firstName"></av-sort-icon>
                </th>
                <th avSortableColumn="company" class="cursor-pointer select-none px-4 py-3">
                  Empresa <av-sort-icon field="company"></av-sort-icon>
                </th>
                <th avSortableColumn="jobTitle" class="cursor-pointer select-none px-4 py-3">
                  Cargo <av-sort-icon field="jobTitle"></av-sort-icon>
                </th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3 text-right">Ações</th>
              </tr>
            </ng-template>

            <ng-template #body let-user let-index="index">
              <tr class="transition-colors hover:bg-slate-50">
                <td class="px-4 py-3">
                  <div class="font-semibold text-slate-900">{{ user.firstName }} {{ user.lastName }}</div>
                  <div class="text-xs text-slate-500">{{ user.email }}</div>
                </td>
                <td class="px-4 py-3 text-slate-700">{{ user.company }}</td>
                <td class="px-4 py-3 text-slate-700">{{ user.jobTitle }}</td>
                <td class="px-4 py-3">
                  <span av-badge [variant]="rowBadgeVariant(index)">ativo</span>
                </td>
                <td class="px-4 py-3 text-right">
                  <button av-button variant="gray-outlined" icon="search" iconProvider="av">Ver</button>
                </td>
              </tr>
            </ng-template>
          </av-table>
        </div>
      </section>

      </section>
