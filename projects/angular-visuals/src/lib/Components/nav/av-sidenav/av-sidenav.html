@if (drawerMode() && isOpen() && toggleable()) {
  <button
    type="button"
    class="av-sidenav__backdrop"
    [attr.aria-label]="backdropLabel()"
    (click)="closeFromBackdrop()"
  ></button>
}

<nav
  class="av-sidenav"
  [id]="navId"
  [ngStyle]="themeVars()"
  [class.av-sidenav--drawer]="drawerMode()"
  [class.av-sidenav--closed]="!isOpen()"
  [attr.aria-hidden]="!isOpen() ? 'true' : null"
  [attr.aria-label]="ariaLabel()"
  [attr.inert]="!isOpen() ? '' : null"
  (av-nav-link-select)="handleNavigation()"
>
  <div class="av-sidenav__header">
    <ng-content select="[header]"></ng-content>
  </div>

  <div class="av-sidenav__content">
    <ng-content select="[content]"></ng-content>
  </div>

  <div class="av-sidenav__footer">
    <ng-content select="[footer]"></ng-content>
  </div>
</nav>
