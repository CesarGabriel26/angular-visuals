<div
  class="av-progress-circle"
  [ngStyle]="themeVars()"
  [style.width.px]="size()"
  [style.height.px]="size()"
  role="progressbar"
  [attr.aria-valuenow]="percentLabel()"
  aria-valuemin="0"
  aria-valuemax="100"
>
  <svg class="av-progress-circle__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle
      class="av-progress-circle__track"
      cx="50"
      cy="50"
      fill="transparent"
      [attr.r]="radius()"
      [attr.stroke-width]="strokeWidth()"
    ></circle>
    <circle
      class="av-progress-circle__fill"
      [class.av-progress-circle__fill--striped]="striped()"
      cx="50"
      cy="50"
      fill="transparent"
      stroke-linecap="round"
      [attr.r]="radius()"
      [attr.stroke-width]="strokeWidth()"
      [attr.stroke-dasharray]="circumference()"
      [attr.stroke-dashoffset]="dashOffset()"
    ></circle>
  </svg>

  @if (showPercent()) {
    <span class="av-progress-circle__label"> {{ percentLabel() }}% </span>
  }
</div>
