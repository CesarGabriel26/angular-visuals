<div class="av-input"
[style.--av-input-disabled-bg]="`var(--av-${variant()}-100)`"
[style.--av-input-accent]="`var(--av-${variant()}-500)`"
[style.--av-input-accent-dark]="`var(--av-${variant()}-700)`"
>
  @if (label()) {
    <label class="av-input__label">
      {{ label() }}
    </label>
  }

  <div class="av-input__field">
    @if (icon() || loading()) {
      <div class="av-input__icon">
        <span av-icon [name]="loading()? loadingIcon()!: icon()!"></span>
      </div>
    }

    <input
      #inputRef
      [type]="type()"
      [value]="value"
      [placeholder]="placeholder()"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onTouched()"
      class="av-input__control"
      [class.av-input__control--with-icon]="icon()"
      [class.av-input__control--without-icon]="!icon()"
      [ngClass]="controlClasses"
    />
  </div>

  @if (isInvalid || errorMessage()) {
    <span class="av-input__error">
      {{ errorMessage() || 'Campo inválido' }}
    </span>
  }
</div>
