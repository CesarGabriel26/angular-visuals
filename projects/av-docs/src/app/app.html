<av-inline class="docs-shell">
  <av-sidenav [toggleable]="true" [width]="'17rem'">
    <div header>
      <a class="brand" routerLink="/overview">
        <span class="brand-mark">Av</span>
        <span>
          <strong>Angular Visuals</strong>
          <small>Style library docs</small>
        </span>
      </a>
    </div>

    <div content>
      <div class="nav-section-label">Comece aqui</div>
      <av-nav-link route="/overview" icon="dashboard" label="Visão geral" />
      <av-nav-link route="/guides" icon="menu_book" label="Guias" />

      <div class="nav-section-label">Fundamentos</div>
      <av-nav-link route="/foundations/colors" icon="palette" label="Cores" />
      <av-nav-link route="/foundations/typography" icon="format_size" label="Tipografia" />
      <av-nav-link route="/foundations/spacing" icon="space_bar" label="Espaçamento" />

      <div class="nav-section-label">Componentes</div>
      <av-dropdown label="Componentes" icon="widgets">
        @for (componentDoc of componentDocs; track componentDoc.slug) {
          <av-nav-link
            [route]="['/components', componentDoc.slug]"
            [label]="componentDoc.name"
            [description]="componentDoc.tag"
            [badge]="componentDoc.hasNew ? 'New' : null"
          />
        }
      </av-dropdown>
    </div>

    <div footer>
      <div class="version">v0.1.0 · Em construção</div>
    </div>
  </av-sidenav>

  <div class="flex-1 h-full min-h-0 min-w-0 w-full">
    <router-outlet />
  </div>
</av-inline>
